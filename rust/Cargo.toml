# One package, two crates (Rust 1 p.124):
#   src/lib.rs  -> library crate `near_intents_amm_solver` (all the logic)
#   src/main.rs -> binary crate of the same name (a thin wrapper)
# Cargo finds both by these file names, so no [lib] or [[bin]] section is needed.

